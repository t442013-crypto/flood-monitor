<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปสถานการณ์น้ำท่วม | บางบัวทอง</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-water"></i> น้ำท่วมบางบัวทอง
      </a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html"><i class="bi bi-map"></i> แผนที่</a>
        <a class="nav-link active" href="dashboard.html"><i class="bi bi-bar-chart"></i> สรุปข้อมูล</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <h3 class="mb-4 fw-bold"><i class="bi bi-bar-chart-line"></i> สรุปสถานการณ์น้ำท่วม</h3>

    <!-- สรุปจำนวน -->
    <div class="row g-3 mb-4" id="statsCards">
      <!-- จะถูกเติมด้วย JavaScript -->
    </div>

    <!-- ตารางรายการล่าสุด -->
    <div class="card shadow-sm">
      <div class="card-header bg-white fw-semibold">
        รายการรายงานล่าสุด
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>เวลา</th>
                <th>ตำบล</th>
                <th>ระดับ</th>
                <th>รายละเอียด</th>
                <th>ผู้รายงาน</th>
              </tr>
            </thead>
            <tbody id="reportTable">
              <tr>
                <td colspan="5" class="text-center py-4 text-muted">กำลังโหลด...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwiz2xXaWswpkvTotGpfMAh5hRtDX0V4oE8_gXX5mqZ7FY6IzPsumqB3V4pvRccHOlyuQ/exec";

    async function loadDashboard() {
      try {
        // โหลดสถิติ
        const statsRes = await fetch(`${WEB_APP_URL}?action=getStats`);
        const stats = await statsRes.json();

        if (stats.success) {
          renderStats(stats.data);
        }

        // โหลดรายการ
        const listRes = await fetch(`${WEB_APP_URL}?action=getAll&status=เปิด`);
        const list = await listRes.json();

        if (list.success) {
          renderTable(list.data.slice(0, 20)); // แสดง 20 รายการล่าสุด
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderStats(data) {
      const container = document.getElementById("statsCards");
      container.innerHTML = `
        <div class="col-md-4">
          <div class="card stat-card border-0 shadow-sm bg-primary text-white">
            <div class="card-body text-center">
              <h2 class="fw-bold">${data.total}</h2>
              <p class="mb-0">จุดน้ำท่วมที่เปิดอยู่</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card stat-card border-0 shadow-sm">
            <div class="card-body">
              <h6 class="text-muted">แยกตามระดับ</h6>
              ${Object.entries(data.byLevel || {}).map(([k, v]) => 
                `<div class="d-flex justify-content-between"><span>${k}</span><strong>${v}</strong></div>`
              ).join("")}
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card stat-card border-0 shadow-sm">
            <div class="card-body">
              <h6 class="text-muted">แยกตามตำบล</h6>
              ${Object.entries(data.byTambon || {}).map(([k, v]) => 
                `<div class="d-flex justify-content-between"><span>${k}</span><strong>${v}</strong></div>`
              ).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderTable(data) {
      const tbody = document.getElementById("reportTable");
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">ยังไม่มีรายงาน</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(r => `
        <tr>
          <td class="small">${r.timestamp}</td>
          <td>${r.tambon}</td>
          <td><span class="badge bg-${r.level === 'รุนแรง' ? 'danger' : r.level === 'ปานกลาง' ? 'warning text-dark' : 'success'}">${r.level}</span></td>
          <td class="small">${r.description || '-'}</td>
          <td class="small">${r.reporter_name}</td>
        </tr>
      `).join("");
    }

    loadDashboard();
  </script>
</body>
</html>
